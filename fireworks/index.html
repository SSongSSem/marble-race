<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밤하늘 불꽃 편지</title>
</head>
<body>

<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0B0E1A;
    color: #EDEBFF;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    overflow: hidden;
  }
  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }
  .bar {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    align-items: center;
    background: rgba(18, 20, 38, 0.72);
    border: 1px solid rgba(147, 151, 196, 0.25);
    border-radius: 16px;
    padding: 10px 12px;
    backdrop-filter: blur(10px);
    width: min(560px, calc(100vw - 24px));
    z-index: 5;
  }
  .bar input {
    flex: 1;
    min-width: 0;
    background: rgba(11, 14, 26, 0.8);
    border: 1px solid rgba(147, 151, 196, 0.3);
    border-radius: 10px;
    color: #EDEBFF;
    font: inherit;
    font-size: 1rem;
    padding: 10px 12px;
  }
  .bar input::placeholder { color: #7B7F9E; }
  .bar input:focus-visible, .bar button:focus-visible { outline: 2px solid #FFD98A; outline-offset: 2px; }
  .bar button {
    font: inherit;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    padding: 10px 14px;
    flex: none;
  }
  #fire {
    background: #FFD98A;
    color: #3A2B05;
    font-size: 1rem;
  }
  #fire:hover { filter: brightness(1.07); }
  #fire:active { transform: translateY(1px); }
  .icon {
    background: transparent;
    color: #9DA1C4;
    border: 1px solid rgba(147, 151, 196, 0.3);
    font-size: 0.95rem;
    padding: 10px 11px;
  }
  .icon:hover { color: #EDEBFF; }
  .hint {
    position: fixed;
    left: 50%;
    bottom: 86px;
    transform: translateX(-50%);
    color: rgba(157, 161, 196, 0.75);
    font-size: 0.85rem;
    z-index: 5;
    pointer-events: none;
    text-align: center;
    width: max-content;
    max-width: calc(100vw - 24px);
    transition: opacity 1s ease;
  }
  .hint.gone { opacity: 0; }
  #net {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #555A78;
    flex: none;
    display: none;
  }
  #net.on { display: block; background: #6FDD8B; box-shadow: 0 0 8px rgba(111,221,139,0.7); }
  #net.off { display: block; background: #E06060; }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 6, 12, 0.87);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay .box {
    background: #161830;
    border: 1px solid rgba(147, 151, 196, 0.3);
    border-radius: 18px;
    padding: 26px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    text-align: center;
    max-width: 420px;
    width: 100%;
  }
  .overlay .box h3 { margin: 0; font-size: 1.25rem; }
  #qrimg {
    width: 260px;
    height: 260px;
    background: #fff;
    border-radius: 8px;
    image-rendering: pixelated;
  }
  .roomcode { margin: 0; color: #9DA1C4; font-size: 0.88rem; }
  .roomcode strong { color: #FFD98A; letter-spacing: 0.08em; }
</style>

<canvas id="sky"></canvas>
<p class="hint" id="hint">하늘을 탭해도 폭죽이 터져요 · 문장을 쓰고 쏘아 올려 보세요</p>
<div class="bar">
  <span id="net" title="함께 쏘기 연결 상태"></span>
  <input type="text" id="msg" maxlength="40" placeholder="밤하늘에 쓸 문장" autocomplete="off">
  <button id="fire">🎆 쏘아 올리기</button>
  <button class="icon" id="qrbtn" aria-label="참여 QR 보기" hidden>📱</button>
  <button class="icon" id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <button class="icon" id="fs" aria-label="전체화면">⛶</button>
</div>

<div class="overlay" id="qrbox">
  <div class="box">
    <h3>📱 QR 찍고 함께 쏘기</h3>
    <img id="qrimg" alt="참여 QR 코드">
    <p class="roomcode">방 코드 <strong id="roomcode"></strong> · 폰에서 문장을 쓰면 이 화면에 떠요</p>
    <button class="icon" id="qrclose">닫기</button>
  </div>
</div>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.

      for (var xx = 0; xx < oc.width; xx += step) {
        if (img[(yy * oc.width + xx) * 4 + 3] > 128) {
          pts.push({ x: xx - oc.width / 2, y: yy - oc.height / 2 });
        }
      }
    }
    var cap = reduced ? 700 : 1500;
    while (pts.length > cap) {
      pts = pts.filter(function (_, i) { return i % 2 === 0; });
    }
    var cx = W / 2, cy = H * 0.38;
    return pts.map(function (p) { return { x: cx + p.x, y: cy + p.y }; });
  }

  function launchText(text) {
    var hue = [42, 200, 320, 150, 268][Math.floor(Math.random() * 5)];
    rockets.push({ x: W / 2 + (Math.random() * 80 - 40), y: H + 10,
                   tx: W / 2, ty: H * 0.38, hue: hue, text: text,
                   vx: 0, vy: -(H / 60) * (reduced ? 1.4 : 1) });
    phase = 'flight';
    soundLaunch();
  }

  function explodeToText(r) {
    var pts = samplePoints(r.text);
    letters = pts.map(function (p, i) {
      var a = Math.random() * 6.28, sp = Math.random() * 7;
      return { x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
               tx: p.x, ty: p.y, delay: Math.random() * 30, t: 0, hue: r.hue,
               tw: Math.random() * 6.28 };
    });
    phase = 'forming';
    formT = 0;
    soundBoom(true);
  }

  function spawnBurst(x, y, hue, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.28, sp = 1 + Math.random() * 5.5;
      sparks.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                    life: 0, max: 50 + Math.random() * 40,
                    hue: hue + Math.random() * 30 - 15, sz: 1.2 + Math.random() * 1.6 });
    }
  }

  function ambient(x, y) {
    var hue = Math.random() * 360;
    spawnBurst(x, y, hue, reduced ? 40 : 90);
    soundBoom(false);
  }

  // ===== 진행 =====
  var dispatchT = 0;
  function nextChunk() {
    if (queue.length) launchText(queue.shift());
  }

  function update() {
    // 로켓
    for (var i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i];
      r.x += (r.tx - r.x) * 0.04;
      r.y += r.vy;
      r.vy *= 0.985;
      if (!reduced) {
        sparks.push({ x: r.x + Math.random() * 4 - 2, y: r.y, vx: Math.random() - 0.5,
                      vy: 1 + Math.random(), life: 20, max: 34, hue: r.hue, sz: 1 });
      }
      if (r.y <= r.ty || r.vy > -1.5) {
        rockets.splice(i, 1);
        explodeToText(r);
      }
    }
    // 글자 입자
    if (phase === 'forming' || phase === 'releasing') {
      formT++;
      var allDead = true;
      for (i = 0; i < letters.length; i++) {
        var p = letters[i];
        p.t++;
        if (phase === 'forming') {
          allDead = false;
          if (p.t > p.delay) {
            p.vx += (p.tx - p.x) * 0.028;
            p.vy += (p.ty - p.y) * 0.028;
            p.vx *= 0.82; p.vy *= 0.82;
          } else { p.vy += 0.06; }
          p.x += p.vx; p.y += p.vy;
        } else {
          p.x += p.vx; p.y += p.vy;
          p.vy += 0.055;
          p.vx *= 0.985; p.vy *= 0.985;
          if (p.t < p.max) allDead = false;
        }
      }
      if (phase === 'forming' && formT > HOLD) {
        phase = 'releasing';
        for (i = 0; i < letters.length; i++) {
          var q = letters[i];
          var a = Math.random() * 6.28, sp = 0.5 + Math.random() * 2.5;
          q.vx = Math.cos(a) * sp; q.vy = Math.sin(a) * sp - 0.5;
          q.t = 0; q.max = 60 + Math.random() * 50;
        }
      }
      if (phase === 'releasing' && allDead) {
        letters = [];
        phase = 'idle';
      }
    }
    // 자유 입자
    for (i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      s.life++;
      s.x += s.vx; s.y += s.vy;
      s.vy += 0.05;
      s.vx *= 0.985; s.vy *= 0.985;
      if (s.life > s.max) sparks.splice(i, 1);
    }
    // 대기열 발사 (0.5초 간격)
    if (phase === 'idle' && queue.length) {
      if (++dispatchT > 30) { dispatchT = 0; nextChunk(); }
    } else dispatchT = 0;
    // 한가할 때 배경 폭죽
    if (!reduced && phase === 'idle' && !queue.length) {
      if (++ambientTimer > 210) {
        ambientTimer = 0;
        spawnBurst(W * (0.15 + Math.random() * 0.7), H * (0.12 + Math.random() * 0.35),
                   Math.random() * 360, 60);
      }
    }
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // 밤하늘
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0B0E1A');
    g.addColorStop(0.75, '#131632');
    g.addColorStop(1, '#1B1A3E');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // 별
    var now = performance.now() / 1000;
    ctx.fillStyle = '#C9CCE8';
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = 0.25 + 0.5 * Math.abs(Math.sin(now * 0.7 + st.p));
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, 6.284);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';
    // 로켓
    for (i = 0; i < rockets.length; i++) {
      var r = rockets[i];
      ctx.fillStyle = 'hsl(' + r.hue + ', 90%, 75%)';
      ctx.beginPath();
      ctx.arc(r.x, r.y, 2.6, 0, 6.284);
      ctx.fill();
    }
    // 자유 입자
    for (i = 0; i < sparks.length; i++) {
      var s = sparks[i];
      var a = 1 - s.life / s.max;
      ctx.fillStyle = 'hsla(' + s.hue + ', 95%, 68%, ' + (a * 0.9) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.sz, 0, 6.284);
      ctx.fill();
    }
    // 글자 입자
    for (i = 0; i < letters.length; i++) {
      var p = letters[i];
      var al;
      if (phase === 'forming') {
        al = 0.65 + 0.35 * Math.sin(now * 6 + p.tw);
      } else {
        al = Math.max(0, 1 - p.t / p.max);
      }
      ctx.fillStyle = 'hsla(' + p.hue + ', 90%, 74%, ' + al + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.7, 0, 6.284);
      ctx.fill();
      ctx.fillStyle = 'hsla(' + p.hue + ', 90%, 88%, ' + (al * 0.35) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3.6, 0, 6.284);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  (function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  })();

  // ===== 조작 =====
  var $msg = document.getElementById('msg');
  var $hint = document.getElementById('hint');
  var launched = false;

  function enqueue(text) {
    var chunks = chunkMessage(text);
    if (!chunks.length) return;
    if (queue.length > 24) return;  // 폭주 방지
    queue = queue.concat(chunks);
    launched = true;
    $hint.classList.add('gone');
  }

  function fire() {
    var text = $msg.value.trim();
    if (!text) { $msg.focus(); return; }
    audio();
    if (isGuest && connected) {
      client.publish(TOPIC_PREFIX + room, JSON.stringify({ t: text.slice(0, 40) }));
      var b = document.getElementById('fire');
      b.disabled = true;
      b.textContent = '🎆 전송됨!';
      setTimeout(function () { b.disabled = false; b.textContent = '🎆 쏘아 올리기'; }, 2500);
    }
    enqueue(text);
    $msg.value = '';
  }
  document.getElementById('fire').addEventListener('click', fire);
  $msg.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); fire(); }
  });

  cv.addEventListener('pointerdown', function (e) {
    if (e.clientY > H - 90) return;
    audio();
    ambient(e.clientX, Math.min(e.clientY, H * 0.75));
    $hint.classList.add('gone');
  });

  document.getElementById('mute').addEventListener('click', function () {
    muted = !muted;
    this.textContent = muted ? '🔇' : '🔊';
  });
  document.getElementById('fs').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });

  // 첫 방문 연출: 잠시 뒤 기본 문장을 자동으로 쏘아 올린다 (소리는 상호작용 전이라 무음)
  setTimeout(function () {
    if (launched || phase !== 'idle' || queue.length) return;
    queue = chunkMessage('선생님 오늘도 수고하셨습니다');
  }, reduced ? 99999999 : 1800);

  // ===== 함께 쏘기 (공개 MQTT 중계) =====
  var params = new URLSearchParams(location.search);
  var room = params.get('room');
  var isGuest = !!room;
  var client = null, connected = false;
  var TOPIC_PREFIX = 'ssongfw/';
  var BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
  var bi = 0;
  var $net = document.getElementById('net');
  var $qrbtn = document.getElementById('qrbtn');

  function setNet(on) {
    $net.className = on ? 'on' : 'off';
    $net.title = on ? '함께 쏘기 연결됨' : '함께 쏘기 연결 끊김';
  }

  function loadScript(src, ok, fail) {
    var s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  }

  function connectNet() {
    if (typeof mqtt === 'undefined') return;
    try {
      client = mqtt.connect(BROKERS[bi], { connectTimeout: 6000, reconnectPeriod: 3000 });
    } catch (e) { return; }
    client.on('connect', function () {
      connected = true;
      setNet(true);
      if (!isGuest) {
        client.subscribe(TOPIC_PREFIX + room);
        $qrbtn.hidden = false;
      }
    });
    client.on('message', function (t, buf) {
      if (isGuest) return;
      var d;
      try { d = JSON.parse(buf.toString()); } catch (e) { return; }
      if (typeof d.t !== 'string') return;
      var text = d.t.replace(/[\u0000-\u001F]/g, '').slice(0, 40).trim();
      if (text) enqueue(text);
    });
    client.on('close', function () {
      if (connected) { connected = false; setNet(false); }
    });
    client.on('error', function () {
      if (!connected && bi < BROKERS.length - 1) {
        try { client.end(true); } catch (e) {}
        bi++;
        connectNet();
      }
    });
  }

  function initNet() {
    if (!room) {
      try { room = sessionStorage.getItem('fwroom'); } catch (e) {}
      if (!room) {
        room = Math.random().toString(36).slice(2, 8);
        try { sessionStorage.setItem('fwroom', room); } catch (e) {}
      }
    }
    if (isGuest) {
      $hint.textContent = '문장을 쓰고 쏘아 올리면 발표 화면에도 떠요!';
      $hint.classList.remove('gone');
      document.getElementById('fs').hidden = true;
    }
    loadScript('https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js', connectNet, function () {
      loadScript('https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js', connectNet, function () {});
    });
  }
  initNet();

  // 참여 QR (발표 화면 전용)
  var $qrbox = document.getElementById('qrbox');
  $qrbtn.addEventListener('click', function () {
    var link = location.origin + location.pathname + '?room=' + room;
    try {
      var qr = qrcode(0, 'M');
      qr.addData(link);
      qr.make();
      document.getElementById('qrimg').src = qr.createDataURL(8, 16);
    } catch (e) {}
    document.getElementById('roomcode').textContent = room;
    $qrbox.classList.add('show');
  });
  document.getElementById('qrclose').addEventListener('click', function () {
    $qrbox.classList.remove('show');
  });
})();
</script>
</body>
</html>
