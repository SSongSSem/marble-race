<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운명의 구슬 레이스</title>
</head>
<body>

<style>
  :root {
    --bg: #14161D;
    --panel: #1D2029;
    --panel-line: #2E3342;
    --ink: #EFEFE6;
    --muted: #8B90A1;
    --accent: #FFC94D;
    --accent-ink: #2B2107;
    --track: #262B3A;
    --track-line: #3D4254;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1060px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  header { margin-bottom: 14px; }
  header h1 {
    margin: 0;
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  header h1 .flag { color: var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }

  .layout {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .side {
    flex: 0 0 280px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .stage {
    flex: 1;
    position: relative;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  @media (max-width: 820px) {
    .layout { flex-direction: column; }
    .side { flex: none; width: 100%; }
    .stage { width: 100%; }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card h2 {
    margin: 0;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  input[type="text"] {
    width: 100%;
    border: 1px solid var(--panel-line);
    border-radius: 9px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    padding: 10px 12px;
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button {
    font: inherit;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    padding: 10px 14px;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1.08rem;
    padding: 13px 16px;
    border-radius: 12px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }
  .btn-primary:not(:disabled):hover { filter: brightness(1.06); }
  .btn-primary:not(:disabled):active { transform: translateY(2px); box-shadow: none; }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--panel-line);
    font-weight: 600;
    font-size: 0.88rem;
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--muted); }
  .btnrow { display: flex; gap: 8px; }
  .btnrow > * { flex: 1; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 20px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--panel-line);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .chip .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex: none;
  }
  .chip button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 0 2px;
    line-height: 1;
  }
  .chip button:hover { color: var(--ink); }
  .joincount { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .ranklist {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 300px;
    overflow-y: auto;
  }
  .ranklist li {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.92rem;
    font-weight: 600;
    background: var(--bg);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .ranklist .rank {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    width: 2.2em;
    flex: none;
  }
  .ranklist li:first-child .rank { color: var(--accent); }
  .ranklist .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .empty-note { color: var(--muted); font-size: 0.85rem; margin: 0; }

  #race {
    background: var(--track);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    width: 100%;
    max-width: 500px;
    height: auto;
    display: block;
  }
  #minimap {
    background: var(--track);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    width: 56px;
    height: auto;
    display: block;
    flex: none;
  }
  @media (max-width: 480px) { #minimap { display: none; } }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 11, 16, 0.82);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay .box {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 18px;
    padding: 28px;
    max-width: 420px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    text-align: center;
  }
  #qrimg { width: 260px; height: 260px; image-rendering: pixelated; border-radius: 8px; background: #fff; padding: 0; }
  #qrbox .url-edit { width: 100%; display: flex; flex-direction: column; gap: 6px; }
  #qrbox .url-edit label { font-size: 0.78rem; color: var(--muted); text-align: left; }
  #qrbox h3 { margin: 0; font-size: 1.3rem; }

  #countdown {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }
  #countdown.show { display: flex; }
  #countdown span {
    font-size: 7rem;
    font-weight: 800;
    color: var(--accent);
    text-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }
  @media (prefers-reduced-motion: no-preference) {
    #countdown.show span { animation: pop 0.9s ease infinite; }
    @keyframes pop {
      0% { transform: scale(0.4); opacity: 0; }
      25% { transform: scale(1.15); opacity: 1; }
      60% { transform: scale(1); }
      100% { transform: scale(1); opacity: 0.9; }
    }
  }

  #resultbox .winner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  #resultbox .winner .medal { font-size: 3rem; }
  #resultbox .winner .name {
    font-size: 2rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #resultbox .winner .name .dot { width: 20px; height: 20px; border-radius: 50%; display: inline-block; }
  #resultbox ol {
    margin: 0;
    padding: 0;
    list-style: none;
    width: 100%;
    max-height: 240px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
    text-align: left;
  }
  #resultbox ol li {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border-radius: 8px;
    padding: 6px 10px;
    font-weight: 600;
    font-size: 0.95rem;
  }
  #resultbox ol .rank { color: var(--muted); width: 2.4em; font-variant-numeric: tabular-nums; flex: none; }
  #resultbox ol .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
</style>

<div class="wrap">
  <header>
    <h1><span class="flag">🏁</span> 운명의 구슬 레이스</h1>
    <p>닉네임을 넣으면 구슬이 입장합니다. 맵은 매 경주마다 새로 만들어져요.</p>
  </header>

  <div class="layout">
    <div class="side">
      <section class="card">
        <h2>참가자 입장</h2>
        <input type="text" id="nick" placeholder="닉네임 입력 후 Enter (쉼표로 여러 명)" autocomplete="off">
        <div class="chips" id="chips"></div>
        <span class="joincount" id="joincount">0명 입장</span>
        <div class="btnrow">
          <button class="btn-ghost" id="sample">예시 12명</button>
          <button class="btn-ghost" id="clear">전체 지우기</button>
        </div>
      </section>

      <section class="card">
        <button class="btn-primary" id="start">🏁 레이스 시작!</button>
        <div class="btnrow">
          <button class="btn-ghost" id="qrbtn">📱 입장 QR</button>
          <button class="btn-ghost" id="newmap">🗺️ 새 맵</button>
        </div>
      </section>

      <section class="card">
        <h2>실시간 순위</h2>
        <ol class="ranklist" id="livelist"></ol>
        <p class="empty-note" id="liveempty">레이스가 시작되면 결승선 통과 순서대로 표시됩니다.</p>
      </section>
    </div>

    <div class="stage">
      <canvas id="race" width="960" height="1520"></canvas>
      <canvas id="minimap" width="112" height="1520"></canvas>
      <div id="countdown"><span id="cdnum">3</span></div>
    </div>
  </div>
</div>

<div class="overlay" id="qrbox">
  <div class="box">
    <h3>📱 QR 찍고 입장!</h3>
    <img id="qrimg" alt="접속 QR 코드">
    <div class="url-edit">
      <label for="qrurl">공유 링크가 다르면 여기 붙여넣으세요 — QR이 즉시 바뀝니다</label>
      <input type="text" id="qrurl">
    </div>
    <button class="btn-ghost" id="qrclose">닫기</button>
  </div>
</div>

<div class="overlay" id="resultbox">
  <div class="box">
    <div class="winner">
      <span class="medal">🏆</span>
      <span class="name"><span class="dot" id="windot"></span><span id="winname"></span></span>
    </div>
    <ol id="finallist"></ol>
    <div class="btnrow" style="width:100%">
      <button class="btn-primary" id="again">다시 경주 (새 맵)</button>
      <button class="btn-ghost" id="closeresult">닫기</button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;

          utf8.push(0xc0 | (charcode >> 6),
              0x80 | (charcode & 0x3f));
        }
        else if (charcode < 0xd800 || charcode >= 0xe000) {
          utf8.push(0xe0 | (charcode >> 12),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
        // surrogate pair
        else {
          i++;
          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
      }
      return utf8;
    }
    return toUTF8Array(s);
  };

}();

  } else if (typeof exports === 'object') {

</script>
<script>
(function () {
  'use strict';

  // ===== 상수 =====
  var W = 480;              // 월드 가로
  var VIEW_H = 760;         // 뷰포트 세로(월드 단위)
  var DPR = 2;
  var LOBBY_FLOOR_Y = 150;
  var MARBLE_R = 11;
  var GRAV = 0.34;
  var REST = 0.5;
  var TANG = 0.99;
  var MAX_V = 11;
  var SUBSTEPS = 3;
  var COLORS = ['#FF6B6B','#FFA94D','#FFD43B','#A9E34B','#51CF66','#38D9A9',
                '#22B8CF','#4DABF7','#748FFC','#9775FA','#DA77F2','#F783AC'];
  var SAMPLE = ['번개고양이','달리는감자','슈퍼문어','졸린판다','불꽃돌이','아이스티',
                '점프토끼','민트초코','로켓펭귄','꿀호떡','바람개비','폭풍꿀벌'];

  var cv = document.getElementById('race');
  var ctx = cv.getContext('2d');
  var mm = document.getElementById('minimap');
  var mctx = mm.getContext('2d');
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ===== 상태 =====
  var marbles = [];         // {name,color,x,y,vx,vy,r,finished,still}
  var segs = [];            // {x1,y1,x2,y2,r}
  var pegs = [];            // {x,y,r}
  var spinners = [];        // {cx,cy,len,angle,speed}
  var worldH = 2000;
  var finishY = 1900;
  var lobbyFloor = null;
  var racing = false;
  var countdownOn = false;
  var finishedList = [];
  var camY = 0;

  // ===== 맵 자동 생성 =====
  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function buildMap() {
    segs = []; pegs = []; spinners = [];
    // 로비(대기장) 벽 + 바닥
    lobbyFloor = { x1: 0, y1: LOBBY_FLOOR_Y, x2: W, y2: LOBBY_FLOOR_Y, r: 0, isFloor: true };
    segs.push(lobbyFloor);

    var y = LOBBY_FLOOR_Y + 20;
    y = addFunnel(y);
    // 본 코스: 섹션 4~5개 무작위 조합 (같은 종류 연속 방지)
    var kinds = ['pegs', 'zigzag', 'spinner'];
    var count = 4 + Math.floor(Math.random() * 2);
    var last = '';
    for (var i = 0; i < count; i++) {
      var k;
      do { k = pick(kinds); } while (k === last);
      last = k;
      if (k === 'pegs') y = addPegs(y);
      else if (k === 'zigzag') y = addZigzag(y);
      else y = addSpinner(y);
    }
    y = addFunnel(y);
    finishY = y + 60;
    worldH = finishY + 260;
    // 좌우 벽
    segs.push({ x1: 0, y1: 0, x2: 0, y2: worldH, r: 0 });
    segs.push({ x1: W, y1: 0, x2: W, y2: worldH, r: 0 });
  }

  function addFunnel(y) {
    var gapC = rand(130, W - 130);
    var gapW = rand(85, 125);
    segs.push({ x1: 0, y1: y, x2: gapC - gapW / 2, y2: y + 105, r: 0 });
    segs.push({ x1: W, y1: y, x2: gapC + gapW / 2, y2: y + 105, r: 0 });
    return y + 150;
  }

  function addPegs(y) {
    var rows = 3 + Math.floor(Math.random() * 3);
    for (var r = 0; r < rows; r++) {
      var yy = y + 20 + r * 58;
      var off = (r % 2 ? 30 : 0) + rand(-8, 8);
      for (var x = 40 + off; x <= W - 30; x += 60) {
        pegs.push({ x: x + rand(-6, 6), y: yy, r: 7 });
      }
    }
    return y + 20 + rows * 58 + 20;
  }

  function addZigzag(y) {
    var n = 2 + Math.floor(Math.random() * 2);
    var goRight = Math.random() < 0.5;
    for (var i = 0; i < n; i++) {
      var len = rand(320, 385);
      var drop = rand(85, 100);
      if (goRight) segs.push({ x1: 0, y1: y, x2: len, y2: y + drop, r: 0 });
      else segs.push({ x1: W, y1: y, x2: W - len, y2: y + drop, r: 0 });
      goRight = !goRight;
      y += drop + 68;
    }
    return y + 10;
  }

  function addSpinner(y) {
    var twin = Math.random() < 0.45;
    if (twin) {
      var sp = rand(0.028, 0.045);
      spinners.push({ cx: 130, cy: y + 95, len: 115, angle: rand(0, 3.14), speed: sp });
      spinners.push({ cx: 350, cy: y + 95, len: 115, angle: rand(0, 3.14), speed: -sp });
    } else {
      spinners.push({ cx: rand(170, 310), cy: y + 95, len: 150, angle: rand(0, 3.14),
                      speed: (Math.random() < 0.5 ? 1 : -1) * rand(0.03, 0.05) });
    }
    return y + 205;
  }

  // ===== 물리 =====
  function collideSeg(m, s) {
    var dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    var len2 = dx * dx + dy * dy;
    if (len2 === 0) return false;
    var t = ((m.x - s.x1) * dx + (m.y - s.y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    var px = s.x1 + t * dx, py = s.y1 + t * dy;
    var nx = m.x - px, ny = m.y - py;
    var d = Math.sqrt(nx * nx + ny * ny);
    var rr = m.r + (s.r || 0);
    if (d < rr && d > 0.0001) {
      nx /= d; ny /= d;
      m.x = px + nx * rr; m.y = py + ny * rr;
      var vn = m.vx * nx + m.vy * ny;
      if (vn < 0) {
        var vtx = m.vx - vn * nx, vty = m.vy - vn * ny;
        m.vx = vtx * TANG - vn * REST * nx;
        m.vy = vty * TANG - vn * REST * ny;
      }
      return true;
    }
    return false;
  }

  function collidePeg(m, p) {
    var nx = m.x - p.x, ny = m.y - p.y;
    var d = Math.sqrt(nx * nx + ny * ny);
    var rr = m.r + p.r;
    if (d < rr && d > 0.0001) {
      nx /= d; ny /= d;
      m.x = p.x + nx * rr; m.y = p.y + ny * rr;
      var vn = m.vx * nx + m.vy * ny;
      if (vn < 0) {
        var vtx = m.vx - vn * nx, vty = m.vy - vn * ny;
        m.vx = vtx * TANG - vn * REST * nx;
        m.vy = vty * TANG - vn * REST * ny;
      }
    }
  }

  function step() {
    var dt = 1 / SUBSTEPS;
    for (var sp = 0; sp < spinners.length; sp++) spinners[sp].angle += spinners[sp].speed;

    for (var s = 0; s < SUBSTEPS; s++) {
      for (var i = 0; i < marbles.length; i++) {
        var m = marbles[i];
        if (m.finished) continue;
        m.vy += GRAV * dt;
        var v = Math.sqrt(m.vx * m.vx + m.vy * m.vy);
        if (v > MAX_V) { m.vx *= MAX_V / v; m.vy *= MAX_V / v; }
        m.x += m.vx * dt;
        m.y += m.vy * dt;

        for (var j = 0; j < segs.length; j++) {
          if (segs[j].isFloor && racing) continue;  // 레이스 중엔 대기장 바닥 개방
          collideSeg(m, segs[j]);
        }
        for (j = 0; j < pegs.length; j++) collidePeg(m, pegs[j]);
        for (j = 0; j < spinners.length; j++) {
          var spn = spinners[j];
          var hx = Math.cos(spn.angle) * spn.len / 2, hy = Math.sin(spn.angle) * spn.len / 2;
          var bar = { x1: spn.cx - hx, y1: spn.cy - hy, x2: spn.cx + hx, y2: spn.cy + hy, r: 6 };
          if (collideSeg(m, bar)) {
            m.vx += -(m.y - spn.cy) * spn.speed * 0.9;
            m.vy += (m.x - spn.cx) * spn.speed * 0.9;
          }
        }
      }
      // 구슬끼리 충돌
      for (i = 0; i < marbles.length; i++) {
        var a = marbles[i];
        if (a.finished) continue;
        for (var k = i + 1; k < marbles.length; k++) {
          var b = marbles[k];
          if (b.finished) continue;
          var nx = b.x - a.x, ny = b.y - a.y;
          var d = Math.sqrt(nx * nx + ny * ny);
          var rr = a.r + b.r;
          if (d < rr && d > 0.0001) {
            nx /= d; ny /= d;
            var overlap = (rr - d) / 2;
            a.x -= nx * overlap; a.y -= ny * overlap;
            b.x += nx * overlap; b.y += ny * overlap;
            var rvn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
            if (rvn < 0) {
              var imp = -rvn * 0.85 / 2;
              a.vx -= imp * nx; a.vy -= imp * ny;
              b.vx += imp * nx; b.vy += imp * ny;
            }
          }
        }
      }
    }

    // 결승선 통과 + 끼임 방지
    for (var i2 = 0; i2 < marbles.length; i2++) {
      var m2 = marbles[i2];
      if (m2.finished) continue;
      if (racing && m2.y > finishY) {
        m2.finished = true;
        finishedList.push(m2);
        onFinish(m2);
        continue;
      }
      var sp2 = Math.sqrt(m2.vx * m2.vx + m2.vy * m2.vy);
      if (racing && sp2 < 0.18) {
        if (++m2.still > 55) {
          m2.vx += rand(-1.4, 1.4);
          m2.vy -= rand(0.5, 1.5);
          m2.still = 0;
        }
      } else m2.still = 0;
    }
  }

  // ===== 렌더 =====
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, VIEW_H);
    ctx.translate(0, -camY);

    // 결승선(체커 무늬)
    ctx.fillStyle = '#EFEFE6';
    for (var cx2 = 0; cx2 < W; cx2 += 32) {
      ctx.fillRect(cx2, finishY, 16, 8);
      ctx.fillRect(cx2 + 16, finishY + 8, 16, 8);
    }
    ctx.font = 'bold 15px sans-serif';
    ctx.fillStyle = '#8B90A1';
    ctx.textAlign = 'center';
    ctx.fillText('FINISH', W / 2, finishY + 36);

    // 벽·경사로
    ctx.strokeStyle = '#3D4254';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (s.isFloor && racing) continue;
      ctx.beginPath();
      ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x2, s.y2);
      ctx.stroke();
    }
    // 못(peg)
    ctx.fillStyle = '#4A5065';
    for (i = 0; i < pegs.length; i++) {
      ctx.beginPath();
      ctx.arc(pegs[i].x, pegs[i].y, pegs[i].r, 0, 6.284);
      ctx.fill();
    }
    // 회전 바
    ctx.strokeStyle = '#FFC94D';
    ctx.lineWidth = 9;
    for (i = 0; i < spinners.length; i++) {
      var sp = spinners[i];
      var hx = Math.cos(sp.angle) * sp.len / 2, hy = Math.sin(sp.angle) * sp.len / 2;
      ctx.beginPath();
      ctx.moveTo(sp.cx - hx, sp.cy - hy);
      ctx.lineTo(sp.cx + hx, sp.cy + hy);
      ctx.stroke();
      ctx.fillStyle = '#EFEFE6';
      ctx.beginPath();
      ctx.arc(sp.cx, sp.cy, 5, 0, 6.284);
      ctx.fill();
    }
    // 로비 안내
    if (!racing && !countdownOn) {
      ctx.font = '600 14px sans-serif';
      ctx.fillStyle = 'rgba(239,239,230,0.35)';
      ctx.textAlign = 'center';
      ctx.fillText(marbles.length ? '참가자 대기 중 — 레이스 시작을 눌러 주세요' : '닉네임을 입력하면 구슬이 입장합니다', W / 2, 100);
    }
    // 구슬 + 이름표
    for (i = 0; i < marbles.length; i++) {
      var m = marbles[i];
      if (m.finished) continue;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, 6.284);
      ctx.fillStyle = m.color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(m.x - 3.5, m.y - 3.5, 3, 0, 6.284);
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fill();
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#14161D';
      ctx.strokeText(m.name, m.x, m.y - m.r - 6);
      ctx.fillStyle = '#EFEFE6';
      ctx.fillText(m.name, m.x, m.y - m.r - 6);
    }
    drawMinimap();
  }

  function drawMinimap() {
    var sx = 56 / W, sy = VIEW_H / worldH;
    mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    mctx.clearRect(0, 0, 56, VIEW_H);
    mctx.strokeStyle = '#3D4254';
    mctx.lineWidth = 1.2;
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (s.isFloor && racing) continue;
      mctx.beginPath();
      mctx.moveTo(s.x1 * sx, s.y1 * sy);
      mctx.lineTo(s.x2 * sx, s.y2 * sy);
      mctx.stroke();
    }
    mctx.fillStyle = '#EFEFE6';
    mctx.fillRect(0, finishY * sy, 56, 2);
    for (i = 0; i < marbles.length; i++) {
      var m = marbles[i];
      if (m.finished) continue;
      mctx.beginPath();
      mctx.arc(m.x * sx, m.y * sy, 2.6, 0, 6.284);
      mctx.fillStyle = m.color;
      mctx.fill();
    }
    // 현재 뷰포트 표시
    mctx.strokeStyle = 'rgba(255,201,77,0.7)';
    mctx.lineWidth = 1.5;
    mctx.strokeRect(1, camY * sy, 54, VIEW_H * sy);
  }

  // ===== 카메라 =====
  function updateCamera() {
    var target = 0;
    if (racing) {
      var lead = 0;
      var anyActive = false;
      for (var i = 0; i < marbles.length; i++) {
        if (!marbles[i].finished) {
          anyActive = true;
          if (marbles[i].y > lead) lead = marbles[i].y;
        }
      }
      if (anyActive) target = Math.max(0, Math.min(lead - VIEW_H * 0.42, worldH - VIEW_H));
      else target = worldH - VIEW_H;
    }
    camY += (target - camY) * 0.09;
  }

  // ===== 루프 =====
  function loop() {
    if (racing || (!countdownOn)) step();
    updateCamera();
    draw();
    requestAnimationFrame(loop);
  }

  // ===== 참가자 =====
  var $nick = document.getElementById('nick');
  var $chips = document.getElementById('chips');
  var $joincount = document.getElementById('joincount');
  var $livelist = document.getElementById('livelist');
  var $liveempty = document.getElementById('liveempty');
  var $start = document.getElementById('start');

  function addMarble(name) {
    if (!name) return;
    if (marbles.some(function (m) { return m.name === name; })) return;
    if (marbles.length >= 30) return;
    marbles.push({
      name: name,
      color: COLORS[marbles.length % COLORS.length],
      x: rand(40, W - 40),
      y: rand(-60, -20),
      vx: rand(-1, 1), vy: 0,
      r: MARBLE_R, finished: false, still: 0
    });
    renderChips();
  }

  function removeMarble(name) {
    marbles = marbles.filter(function (m) { return m.name !== name; });
    marbles.forEach(function (m, i) { m.color = COLORS[i % COLORS.length]; });
    renderChips();
  }

  function renderChips() {
    $chips.innerHTML = '';
    marbles.forEach(function (m) {
      var c = document.createElement('span');
      c.className = 'chip';
      var d = document.createElement('span');
      d.className = 'dot';
      d.style.background = m.color;
      c.appendChild(d);
      c.appendChild(document.createTextNode(m.name));
      var x = document.createElement('button');
      x.textContent = '×';
      x.setAttribute('aria-label', m.name + ' 내보내기');
      x.addEventListener('click', function () { if (!racing) removeMarble(m.name); });
      c.appendChild(x);
      $chips.appendChild(c);
    });
    $joincount.textContent = marbles.length + '명 입장';
    $start.disabled = marbles.length < 2 || racing || countdownOn;
    save();
  }

  $nick.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (racing || countdownOn) return;
    $nick.value.split(/[,\n]+/).forEach(function (s) { addMarble(s.trim()); });
    $nick.value = '';
  });

  document.getElementById('sample').addEventListener('click', function () {
    if (racing || countdownOn) return;
    SAMPLE.forEach(function (n) { addMarble(n); });
  });
  document.getElementById('clear').addEventListener('click', function () {
    if (racing || countdownOn) return;
    marbles = [];
    renderChips();
  });
  document.getElementById('newmap').addEventListener('click', function () {
    if (racing || countdownOn) return;
    buildMap();
  });

  function save() {
    try {
      localStorage.setItem('marblerace', JSON.stringify(marbles.map(function (m) { return m.name; })));
    } catch (e) {}
  }
  function load() {
    try {
      var names = JSON.parse(localStorage.getItem('marblerace') || '[]');
      names.forEach(addMarble);
    } catch (e) {}
  }

  // ===== 레이스 진행 =====
  var $cd = document.getElementById('countdown');
  var $cdnum = document.getElementById('cdnum');

  function startRace() {
    if (marbles.length < 2 || racing || countdownOn) return;
    buildMap(); // 매 경주 새 맵
    finishedList = [];
    $livelist.innerHTML = '';
    $liveempty.style.display = 'none';
    marbles.forEach(function (m, i) {
      m.finished = false; m.still = 0;
      m.x = rand(40, W - 40);
      m.y = rand(30, LOBBY_FLOOR_Y - 30);
      m.vx = rand(-1.5, 1.5); m.vy = 0;
    });
    countdownOn = true;
    renderChips();
    var n = 3;
    $cdnum.textContent = n;
    $cd.classList.add('show');
    var timer = setInterval(function () {
      n--;
      if (n > 0) { $cdnum.textContent = n; return; }
      clearInterval(timer);
      $cd.classList.remove('show');
      countdownOn = false;
      racing = true;
      renderChips();
    }, reduced ? 350 : 900);
  }

  function onFinish(m) {
    var rank = finishedList.length;
    var li = document.createElement('li');
    li.innerHTML = '<span class="rank"></span><span class="dot"></span><span class="nm"></span>';
    li.querySelector('.rank').textContent = rank + '위';
    li.querySelector('.dot').style.background = m.color;
    li.querySelector('.nm').textContent = m.name;
    $livelist.appendChild(li);
    if (rank === 1 && !reduced) confetti();
    if (finishedList.length === marbles.length) {
      racing = false;
      setTimeout(showResult, 700);
    }
  }

  function showResult() {
    var winner = finishedList[0];
    if (!winner) return;
    document.getElementById('winname').textContent = winner.name;
    document.getElementById('windot').style.background = winner.color;
    var $fl = document.getElementById('finallist');
    $fl.innerHTML = '';
    var medals = ['🥇', '🥈', '🥉'];
    finishedList.forEach(function (m, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="rank"></span><span class="dot"></span><span class="nm"></span>';
      li.querySelector('.rank').textContent = medals[i] || (i + 1) + '위';
      li.querySelector('.dot').style.background = m.color;
      li.querySelector('.nm').textContent = m.name;
      $fl.appendChild(li);
    });
    document.getElementById('resultbox').classList.add('show');
    renderChips();
    if (!reduced) confetti();
  }

  document.getElementById('again').addEventListener('click', function () {
    document.getElementById('resultbox').classList.remove('show');
    startRace();
  });
  document.getElementById('closeresult').addEventListener('click', function () {
    document.getElementById('resultbox').classList.remove('show');
    marbles.forEach(function (m) {
      m.finished = false;
      m.x = rand(40, W - 40);
      m.y = rand(-60, -20);
      m.vx = 0; m.vy = 0;
    });
    renderChips();
  });
  $start.addEventListener('click', startRace);

  // ===== QR =====
  var $qrbox = document.getElementById('qrbox');
  var $qrurl = document.getElementById('qrurl');
  var $qrimg = document.getElementById('qrimg');

  function renderQR() {
    var text = $qrurl.value.trim() || location.href;
    try {
      var qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      $qrimg.src = qr.createDataURL(8, 16);
    } catch (e) {
      $qrimg.alt = 'QR 생성 실패 — 링크가 너무 길어요';
    }
  }
  document.getElementById('qrbtn').addEventListener('click', function () {
    if (!$qrurl.value) $qrurl.value = location.href;
    renderQR();
    $qrbox.classList.add('show');
  });
  $qrurl.addEventListener('input', renderQR);
  document.getElementById('qrclose').addEventListener('click', function () {
    $qrbox.classList.remove('show');
  });

  // ===== 색종이 =====
  var confettiCv = document.getElementById('confetti');
  var confettiCtx = confettiCv.getContext('2d');
  function confetti() {
    confettiCv.width = innerWidth;
    confettiCv.height = innerHeight;
    var parts = [];
    for (var i = 0; i < 130; i++) {
      parts.push({
        x: Math.random() * confettiCv.width,
        y: -20 - Math.random() * confettiCv.height * 0.3,
        vy: 2.2 + Math.random() * 3.5,
        vx: -1 + Math.random() * 2,
        s: 5 + Math.random() * 6,
        r: Math.random() * Math.PI,
        vr: -0.1 + Math.random() * 0.2,
        c: COLORS[i % COLORS.length]
      });
    }
    var frames = 0;
    (function tick() {
      confettiCtx.clearRect(0, 0, confettiCv.width, confettiCv.height);
      parts.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate(p.r);
        confettiCtx.fillStyle = p.c;
        confettiCtx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
        confettiCtx.restore();
      });
      if (++frames < 150) requestAnimationFrame(tick);
      else confettiCtx.clearRect(0, 0, confettiCv.width, confettiCv.height);
    })();
  }

  // ===== 시작 =====
  buildMap();
  load();
  renderChips();
  loop();
})();
</script>
</body>
</html>
